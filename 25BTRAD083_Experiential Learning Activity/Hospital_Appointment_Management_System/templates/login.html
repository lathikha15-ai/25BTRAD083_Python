{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Login</h1>

    <label>Email address<input type="email" name="email" required></label>

  <div class="demo-note"><strong>Demo admin:</strong> admin@hospital.com<br><strong>Password:</strong> Admin@123</div>
</div>
{% endblock %}
